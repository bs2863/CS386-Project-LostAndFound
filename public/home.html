<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>My Reports | NAU Lost & Found</title>
		<!-- CSS -->
		<link rel="stylesheet" href="/css/style.css" />
		<link rel="stylesheet" href="/css/home.css" />
	</head>
	<body>
		<!-- Shared Navbar for Site Wide -->
		<div id="navbar"></div>

		<!-- The user's 'inbox' of lost item reports -->
		<main class="container inbox-page">
			<div class="inbox-header">
				<div>
					<h1>My Lost Item Reports</h1>
					<p>Track your reports and claim your item when a match is found.</p>
				</div>
				<a class="inbox-new-report" href="/reportPage.html">Report a lost item</a>
			</div>

			<!-- Messages: errors or important notices -->
			<p id="inboxMessage" class="inbox-message" role="status"></p>

			<!-- Open reports: still waiting to be picked up -->
			<section id="openSection" aria-labelledby="openReportsHeading" hidden>
				<h2 id="openReportsHeading">Open reports</h2>
				<ul id="openReports" class="report-list"></ul>
			</section>

			<!-- Closed reports: collapsed by default -->
			<details id="closedSection" class="closed-reports" hidden>
				<summary id="closedSummary">Closed reports</summary>
				<ul id="closedReports" class="report-list"></ul>
			</details>
		</main>

		<!-- JS -->
		<script src="/js/navbar.js"></script>
		<script src="/js/home.js"></script>
	</body>
</html>
