<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Manage Items | NAU Lost & Found</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <div id="navbar"></div>
    <main class="staff-container">

        <section class="staff-dashboard">
            <h1>Manage Lost & Found Items</h1>
            <p>View or manage lost & found items.</p>
        </section>

        <section class="staff-filter">
            <input type="text" id="staffSearch" placeholder="Search items...">

            <select id="staffTypeFilter">
                <option value="">All Items</option>
                <option value="lost">Lost</option>
                <option value="found">Found</option>

            </select>
        </section>

        <section class="staff-edit" id="editSection" hidden>
            <h2>Edit Items</h2>

            <form id="editForm">

                <label for="editName">Item Name</label>
                <input type="text" id="editName" required>

                <label for="editColor">Color</label>
                <input type="text" id="editColor">

                <label for="editBrand">Brand</label>
                <input type="text" id="editBrand">

                <label for="editDescription">Description</label>
                <textarea id="editDescription"></textarea>

                <label for="editType">Item Type</label>
                <select id="editType">
                    <option value="lost">Lost</option>
                    <option value="found">Found</option>
                </select>

                <label for="editStatus">Status</label>
                <select id="editStatus">
                    <option value="claimed">Claimed</option>
                    <option value="unclaimed">Unclaimed</option>
                    <option value="open">Open</option>

                </select>

                <button type="submit">Save Changes</button>
                <button type="button" id="cancelEdit">Cancel</button>

            </form>
        </section>

        <section class="staff-items">
            <h2>List of Items</h2>

            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Category</th>
                        <th>Location</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="staffItemList">

                </tbody>
            </table>
        </section>


    </main>

    <script src="/js/navbar.js"></script>
    <script src="/js/staffManagement.js"></script>

</body>

</html>
